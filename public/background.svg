<svg width="100%" height="100%" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Very subtle radial vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="90%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0a0a10" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#0a0a10" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#12121d" stop-opacity="1"/>
    </radialGradient>

    <!-- Tiny star glow filter -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background fill -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>

  <!-- Very faint perspective grid -->
  <g opacity="0.07" stroke="#4f83ca" stroke-width="1.2" fill="none">
    <!-- Horizontal lines -->
    <line x1="0" y1="100" x2="1200" y2="220"/>
    <line x1="0" y1="180" x2="1200" y2="340"/>
    <line x1="0" y1="260" x2="1200" y2="460"/>
    <line x1="0" y1="340" x2="1200" y2="580"/>
    <line x1="0" y1="420" x2="1200" y2="700"/>
    <line x1="0" y1="500" x2="1200" y2="820"/>

    <!-- Vertical converging lines (fake perspective) -->
    <line x1="300" y1="0" x2="480" y2="800"/>
    <line x1="500" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="720" y2="800"/>
    <line x1="900" y1="0" x2="840" y2="800"/>
  </g>

  <!-- Tiny scattered stars / constellation feel -->
  <g fill="#f0f0ff" opacity="0.35" filter="url(#soft-glow)">
    <!-- primary tint on a few -->
    <circle cx="180" cy="120" r="1.4" fill="#ffd166" opacity="0.7"/>
    <circle cx="920" cy="180" r="1.1" fill="#ff6b35" opacity="0.6"/>

    <circle cx="340" cy="240" r="1.0"/>
    <circle cx="760" cy="310" r="0.9"/>
    <circle cx="110" cy="380" r="1.2"/>
    <circle cx="1050" cy="450" r="1.3"/>
    <circle cx="620" cy="520" r="0.8"/>
    <circle cx="280" cy="610" r="1.1"/>
    <circle cx="890" cy="680" r="1.0"/>
    <circle cx="450" cy="140" r="0.9"/>
    <circle cx="780" cy="720" r="1.2"/>
    <circle cx="60" cy="290" r="1.0"/>
    <circle cx="990" cy="390" r="0.95"/>
  </g>

</svg>